[package]
name = "novel-gm"
version = "0.2.3"
description = "LLM 主理人小说生成"
authors = ["novel-gm"]
edition = "2021"

[lib]
name = "novel_gm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
